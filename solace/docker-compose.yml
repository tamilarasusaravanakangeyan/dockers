services:
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: solace
    shm_size: "2g"
    ulimits:
      nofile:
        soft: 2448
        hard: 1048576
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=admin
    ports:
      - "8080:8080"   # SEMP/admin console
      - "56000:55555" # SMF
      - "5672:5672"   # AMQP
      - "9000:9000"   # REST messaging
      - "1883:1883"   # MQTT (optional, handy to have)
      - "8008:8008"   # WebSocket messaging (optional)
    volumes:
      - solace-data:/var/lib/solace

volumes:
  solace-data:
