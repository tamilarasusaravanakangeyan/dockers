services:
  pgvector:
    # Official Postgres image with the pgvector extension pre-installed.
    image: pgvector/pgvector:pg17
    container_name: pgvector-learn
    environment:
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
      POSTGRES_DB: vectordb
    ports:
      # Host port 6024 so it never clashes with a locally installed Postgres (5432).
      - "6024:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vectordb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgvector_data:
